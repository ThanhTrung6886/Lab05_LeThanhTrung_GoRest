
name: GoRest API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
 run: |
          newman run 274802010410_LeThanhTrung_GoRest.postman_collection.json \
            -e environment.json \
            --env-var "token=$GOREST_TOKEN"
